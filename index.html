<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlinkRace: Speed Meter</title>
  <link rel="stylesheet" href="style.css" />

  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Firebase App & Realtime Database (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Screen 1: Lobby & Global Leaderboard -->
  <div id="lobby-screen" class="card">
    <h1>👀 BlinkRace</h1>
    <p>Blink as fast as you can to fight the decay!</p>

    <input type="text" id="player-name" placeholder="Your Name" />
    <input type="text" id="room-id" placeholder="Room Code (e.g. 777)" />

    <div class="difficulty-select">
      <label><input type="radio" name="decay" value="1.5" checked /> Casual</label>
      <label><input type="radio" name="decay" value="2.5" /> Fast Decay</label>
      <label><input type="radio" name="decay" value="3.5" /> Insane</label>
    </div>

    <button id="join-btn">Join / Create Room</button>

    <div class="leaderboard-section">
      <h3>🏆 Global Hall of Fame</h3>
      <ol id="leaderboard-list">
        <li>Loading top blinkers...</li>
      </ol>
    </div>
  </div>

  <!-- Screen 2: Game Arena -->
  <div id="game-screen" class="card hidden">
    <div class="header">
      <h3 id="room-display">Room: -</h3>
      <span id="game-status" class="badge">Waiting for Player 2...</span>
    </div>

    <div class="track">
      <div class="player-lane">
        <div class="lane-header">
          <span id="p1-label">Player 1</span>
          <span id="p1-pct">0%</span>
        </div>
        <div class="bar-container">
          <div id="p1-bar" class="progress-bar"></div>
        </div>
      </div>

      <div class="player-lane">
        <div class="lane-header">
          <span id="p2-label">Player 2</span>
          <span id="p2-pct">0%</span>
        </div>
        <div class="bar-container">
          <div id="p2-bar" class="progress-bar p2-color"></div>
        </div>
      </div>
    </div>

    <div class="video-container">
      <video id="webcam" playsinline muted autoplay></video>
      <div id="blink-alert">⚡ BLINK!</div>
    </div>

    <div class="controls-area">
      <button id="start-btn" class="hidden">Start Match</button>
      <div id="countdown-banner" class="hidden">3</div>
    </div>

    <h2 id="winner-banner" class="hidden"></h2>
  </div>

  <script src="app.js"></script>
</body>
</html>
